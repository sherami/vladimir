name: Expand PrivatePhuket RC4

on:
  push:
    branches: [privatephuket-rc4]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-rc4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rebuild and verify RC4 archive
        shell: bash
        run: |
          cat bootstrap/part* > rc4.b64
          test "$(wc -c < rc4.b64)" -eq 83836
          base64 -d rc4.b64 > rc4.zip
          echo "d3a2146e836674ac669bf78bc65a40ef8c42c96561e6cf866a288b4045ea572f  rc4.zip" | sha256sum -c -
          unzip -t rc4.zip

      - name: Expand source tree
        shell: bash
        run: |
          rm -rf .rc4-expanded
          mkdir .rc4-expanded
          unzip -q rc4.zip -d .rc4-expanded
          rm -rf .rc4-expanded/PrivatePhuket_v1_0_RC4_Stabilized/.github
          cp -a .rc4-expanded/PrivatePhuket_v1_0_RC4_Stabilized/. .
          rm -rf bootstrap rc4.b64 rc4.zip .rc4-expanded

      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "PrivatePhuket CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Expand PrivatePhuket RC4 source tree"
          git push origin HEAD:privatephuket-rc4
