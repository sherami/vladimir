name: PrivatePhuket Staging CI
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: privatephuket
          POSTGRES_USER: privatephuket
          POSTGRES_PASSWORD: privatephuket_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privatephuket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://privatephuket:privatephuket_ci@localhost:5432/privatephuket
      JWT_SECRET: ci-only-secret-not-for-staging
      JWT_ISSUER: privatephuket-ci
      JWT_AUDIENCE: privatephuket-api
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            workspace/package-lock.json
            public-web/package-lock.json
      - name: Backend install
        working-directory: backend
        run: npm ci
      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Database migrations
        working-directory: backend
        run: npx tsx src/db/migrate.ts
      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Layan Verde vertical slice
        shell: bash
        run: |
          set -euo pipefail
          (
            cd backend
            npm run dev > /tmp/privatephuket-api.log 2>&1 &
            echo $! > /tmp/privatephuket-api.pid
          )
          cleanup() {
            if [ -f /tmp/privatephuket-api.pid ]; then
              kill "$(cat /tmp/privatephuket-api.pid)" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/v1/health >/dev/null; then break; fi
            if [ "$i" -eq 30 ]; then
              cat /tmp/privatephuket-api.log
              exit 1
            fi
            sleep 1
          done

          TOKEN=$(cd backend && node --input-type=module -e "import jwt from 'jsonwebtoken'; console.log(jwt.sign({sub:'ci-admin',email:'ci@privatephuket',role:'ADMIN'},process.env.JWT_SECRET,{expiresIn:'10m',issuer:process.env.JWT_ISSUER,audience:process.env.JWT_AUDIENCE}))")
          PP_TOKEN="$TOKEN" node staging/scripts/seed-layan-verde.mjs > /tmp/layan-seed.json
          PROPERTY_ID=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/layan-seed.json','utf8')); process.stdout.write(x.propertyId)")
          PP_TOKEN="$TOKEN" PP_PROPERTY_ID="$PROPERTY_ID" node staging/scripts/verify-vertical-slice.mjs
      - name: Analyst Workspace install
        working-directory: workspace
        run: npm ci
      - name: Analyst Workspace audit
        working-directory: workspace
        run: npm audit --audit-level=high
      - name: Analyst Workspace build
        working-directory: workspace
        run: npm run typecheck && npm run build
      - name: Public Web install
        working-directory: public-web
        run: npm ci
      - name: Public Web audit
        working-directory: public-web
        run: npm audit --audit-level=high
      - name: Public Web build
        working-directory: public-web
        run: npm run typecheck && npm run build
