name: Update Backend Lockfile Once
on:
  push:
    branches: [privatephuket-rc5-vitest-security]

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: privatephuket-rc5-vitest-security
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Update backend lockfile
        working-directory: backend
        run: npm install --package-lock-only
      - name: Commit lockfile and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/update-backend-lockfile-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json .github/workflows/update-backend-lockfile-once.yml
          git commit -m "RC5: refresh backend lockfile for Vitest 5"
          git push origin HEAD:privatephuket-rc5-vitest-security
