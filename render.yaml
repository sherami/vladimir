databases:
  - name: privatephuket-staging-db
    databaseName: privatephuket
    user: privatephuket
    region: frankfurt
    plan: free
    ipAllowList: []

services:
  - type: web
    name: privatephuket-staging-api
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c "node dist/db/migrate.js && node dist/server.js"
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: privatephuket-staging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: privatephuket-staging
      - key: JWT_AUDIENCE
        value: privatephuket-api
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: privatephuket-staging-workspace
    runtime: static
    rootDir: workspace
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: web
    name: privatephuket-staging-public
    runtime: static
    rootDir: public-web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_PUBLIC_API_URL
        sync: false
