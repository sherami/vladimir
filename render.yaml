databases:
  - name: privatephuket-staging-db
    databaseName: privatephuket
    user: privatephuket
    region: frankfurt
    plan: free
    ipAllowList: []

services:
  - type: web
    name: privatephuket-staging-api
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: privatephuket-staging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: privatephuket-staging
      - key: JWT_AUDIENCE
        value: privatephuket-api
      - key: WORKSPACE_AUTH_EMAIL
        sync: false
      - key: WORKSPACE_AUTH_PASSWORD
        sync: false
      - key: WORKSPACE_BOOTSTRAP_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: privatephuket-staging-workspace
    runtime: static
    rootDir: workspace
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: web
    name: privatephuket-staging-public
    runtime: static
    rootDir: public-web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_PUBLIC_API_URL
        sync: false
